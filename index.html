<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom Thompson | Personal Site</title>
    <style>
        /* Clean & Professional Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdf5e6; /* Cream Background */
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            width: 100%;
            height: 300px;
            overflow: hidden;
        }

        .banner {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .container {
            max-width: 800px;
            margin: -75px auto 50px; /* Pulls content up over the banner slightly */
            padding: 20px;
            text-align: center;
            background: rgba(253, 245, 230, 0.9); /* Slight transparency */
            border-radius: 15px;
        }

        .portrait {
            width: 350px;
            height: 350px;
            border-radius: 50%; /* Makes it a circle */
            object-fit: cover;
            border: 5px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 20px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .social-link {
            display: inline-block;
            margin-top: 10px;
            color: #0077b5;
            text-decoration: none;
            font-weight: bold;
        }

        .social-link:hover {
            text-decoration: underline;
        }

        hr {
            border: 0;
            height: 1px;
            background: #ccc;
            margin: 40px auto;
            width: 50%;
        }

        .info-section {
            text-align: center;
            display: inline-block;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin-bottom: 15px;
        }

        a {
            color: #2c3e50;
            text-decoration: none;
            border-bottom: 1px solid #ccc;
        }

        a:hover {
            color: #e67e22;
            border-bottom-color: #e67e22;
        }
    </style>
</head>
<body>

    <header>
        <img src="images/banner.png" alt="Banner Image" class="banner">
    </header>

    <div class="container">
        <!-- Profile Section -->
        <img src="images/portrait.jpg" alt="Tom Thompson" class="portrait">
        <h1>Thomas V Thompson II</h1>
        <a href="https://www.linkedin.com/in/tom-thompson-4b68394" class="social-link" target="_blank">Connect on LinkedIn</a>

        <hr>

        <!-- Details Section -->
        <div class="info-section">
            <ul>
                <li>Senior Cinematics Tools Engineer <a href="https://lightspeed.la/en" target="_blank">Lightspeed LA</a></li>
                <li>PhD, <a href="https://utah.edu" target="_blank">University of Utah</a>, 2001</li>
                <li>MS, <a href="https://wfu.edu" target="_blank">Wake Forest University</a>, 1994</li>
                <li>BS, <a href="https://wvutech.edu" target="_blank">West Virginia Institute of Technology</a>, 1992</li>
            </ul>
        </div>
    </div>

</body>
</html>
